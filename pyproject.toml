[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-awesome-app"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.13.1",
    "flwr-datasets[vision]>=0.3.0",
    "torch==2.2.1",
    "torchvision==0.17.1",
    "numpy<2.0.0",
    "wandb (>=0.19.5,<0.20.0)",
    "toml (>=0.10.2,<0.11.0)",
    "scikit-learn (>=1.6.1,<2.0.0)",
]

requires-python = ">=3.10,<3.11"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "jionnnas"

[tool.flwr.app.components]
serverapp = "my_awesome_app.server_app:app"
clientapp = "my_awesome_app.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 100
local-epochs = 1 # clients train for 1 epoch per round
learning-rate = 0.001
batch_size = 64
fraction-fit = 1.0  # all clients participate in each round
device = "cuda" # <-- "cpu" or "cuda"
model = "mia_paper" # <-- loader defined in tasks.create_model()
dataset-split = "target" # <-- "target" or "shadow"
seed = 42

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 5 # number of clients
options.backend.client-resources.num-cpus = 1
# if no GPU avaible -> ERROR -> set it to 0
options.backend.client-resources.num-gpus = 0.25  # 25% VRAM pro Client
# options.backend.init_args.num_cpus = 1 # maximum number of CPUs for the simulation
# options.backend.init_args.num_gpus = 1 # maximum number of GPUs for the simulation
